<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Asianet News Live</title>


    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #000;

            overflow: hidden;

        }


        #player-container {

            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            background: #000;

        }


        #player {

            width: 100%;
            height: 100%;

        }


        #status {

            position: fixed;

            inset: 0;

            z-index: 9999;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #000;

            color: #fff;

            font-family: Arial, sans-serif;

            font-size: 20px;

            text-align: center;

            padding: 30px;

        }


        #status.hidden {

            display: none;

        }

    </style>

</head>


<body>


    <!--
    ========================================================
    YOUTUBE PLAYER
    ========================================================
    -->

    <div id="player-container">

        <div id="player"></div>

    </div>


    <!--
    ========================================================
    STATUS MESSAGE
    ========================================================
    -->

    <div id="status">

        Finding Asianet News live stream...

    </div>



<script>


/*
============================================================
CONFIGURATION
============================================================
*/


/*
 * IMPORTANT:
 *
 * Your previous API key was publicly exposed.
 *
 * REVOKE/ROTATE THAT KEY and create a NEW key.
 *
 * Then put the new key below.
 */
const API_KEY =
    "AIzaSyAanMTtHl2o_pnMBB3i81pDsXV8TBsEdr0";


/*
 * Asianet News YouTube channel ID.
 *
 * This is used directly instead of resolving
 * @asianetnews every time.
 */
const CHANNEL_ID =
    "UCf8w5m0YsRa8MHQ5bwSGmbw";


/*
 * Check for a NEW live broadcast every 30 seconds.
 *
 * This does NOT restart the current video.
 */
const CHECK_INTERVAL =
    30000;


/*
============================================================
GLOBAL VARIABLES
============================================================
*/


let player = null;


/*
 * ID of the broadcast currently playing.
 */
let currentVideoId = null;


/*
 * Prevent multiple simultaneous API checks.
 */
let checkingLive = false;


/*
 * Whether YouTube IFrame API is ready.
 */
let youtubeReady = false;



/*
============================================================
STATUS FUNCTIONS
============================================================
*/


function showStatus(message) {

    const status =
        document.getElementById("status");


    status.textContent =
        message;


    status.classList.remove("hidden");
}



function hideStatus() {

    const status =
        document.getElementById("status");


    status.classList.add("hidden");
}



/*
============================================================
FIND CURRENT ACTIVE LIVE BROADCAST
============================================================
*/


async function getCurrentLiveVideo() {


    /*
     * ------------------------------------------------------
     * STEP 1
     *
     * Search Asianet News for ACTIVE live broadcasts.
     *
     * eventType=live is critical.
     *
     * We are NOT searching for:
     *
     * - latest upload
     * - latest video
     * - livestream archive
     *
     * We specifically request an ACTIVE broadcast.
     * ------------------------------------------------------
     */


    const searchURL =

        "https://www.googleapis.com/youtube/v3/search" +

        "?part=snippet" +

        "&channelId=" +
        encodeURIComponent(CHANNEL_ID) +

        "&eventType=live" +

        "&type=video" +

        "&maxResults=10" +

        "&key=" +
        encodeURIComponent(API_KEY);


    const searchResponse =
        await fetch(searchURL);


    if (!searchResponse.ok) {

        const error =
            await searchResponse.text();


        console.error(
            "YouTube search API error:",
            error
        );


        throw new Error(
            "YouTube live search failed"
        );
    }


    const searchData =
        await searchResponse.json();


    console.log(
        "Active live search:",
        searchData
    );


    /*
     * No currently active broadcast.
     */

    if (
        !searchData.items ||
        searchData.items.length === 0
    ) {

        return null;
    }


    /*
     * Extract video IDs.
     */

    const videoIds =

        searchData.items

            .map(
                item =>
                    item.id &&
                    item.id.videoId
            )

            .filter(Boolean);


    if (
        videoIds.length === 0
    ) {

        return null;
    }



    /*
     * ------------------------------------------------------
     * STEP 2
     *
     * Verify each candidate with videos.list.
     *
     * This gives us:
     *
     * actualStartTime
     * actualEndTime
     *
     * We use these to make absolutely sure the stream
     * hasn't already ended.
     * ------------------------------------------------------
     */


    const verifyURL =

        "https://www.googleapis.com/youtube/v3/videos" +

        "?part=snippet,liveStreamingDetails,status" +

        "&id=" +
        encodeURIComponent(
            videoIds.join(",")
        ) +

        "&key=" +
        encodeURIComponent(API_KEY);


    const verifyResponse =
        await fetch(verifyURL);


    if (!verifyResponse.ok) {

        const error =
            await verifyResponse.text();


        console.error(
            "YouTube verification error:",
            error
        );


        throw new Error(
            "Unable to verify live stream"
        );
    }


    const verifyData =
        await verifyResponse.json();


    console.log(
        "Verified live streams:",
        verifyData
    );



    /*
     * ------------------------------------------------------
     * STEP 3
     *
     * Accept ONLY:
     *
     * actualStartTime exists
     *
     * AND
     *
     * actualEndTime does NOT exist
     *
     * This prevents an old recorded livestream from being
     * selected.
     * ------------------------------------------------------
     */


    const activeStreams =

        (verifyData.items || [])

            .filter(video => {


                const live =
                    video.liveStreamingDetails;


                if (!live) {

                    return false;

                }


                const hasStarted =

                    Boolean(
                        live.actualStartTime
                    );


                const hasNotEnded =

                    !live.actualEndTime;


                const canEmbed =

                    video.status?.embeddable !== false;


                return (

                    hasStarted &&

                    hasNotEnded &&

                    canEmbed

                );

            });



    /*
     * No verified active broadcast.
     */

    if (
        activeStreams.length === 0
    ) {

        return null;
    }



    /*
     * ------------------------------------------------------
     * STEP 4
     *
     * If multiple active broadcasts exist,
     * select the newest one.
     * ------------------------------------------------------
     */


    activeStreams.sort(
        (a, b) => {


            const aStart =

                new Date(

                    a.liveStreamingDetails
                        .actualStartTime

                ).getTime();


            const bStart =

                new Date(

                    b.liveStreamingDetails
                        .actualStartTime

                ).getTime();


            return bStart - aStart;

        }
    );


    return activeStreams[0];

}



/*
============================================================
LOAD YOUTUBE IFRAME API
============================================================
*/


function loadYouTubeAPI() {

    return new Promise(resolve => {


        /*
         * API already loaded.
         */

        if (

            window.YT &&

            window.YT.Player

        ) {

            youtubeReady = true;

            resolve();

            return;

        }



        /*
         * Called by YouTube when its API is ready.
         */

        window.onYouTubeIframeAPIReady =

            function() {

                youtubeReady = true;

                resolve();

            };



        /*
         * Load YouTube API.
         */

        const script =
            document.createElement("script");


        script.src =
            "https://www.youtube.com/iframe_api";


        document.head.appendChild(script);

    });

}



/*
============================================================
START LIVE VIDEO
============================================================
*/


async function playLiveVideo(video) {


    const videoId =
        video.id;


    /*
     * If we're already playing this exact broadcast,
     * DO NOTHING.
     *
     * This is extremely important.
     *
     * It prevents the 30-second polling from restarting
     * the live video.
     */

    if (

        currentVideoId === videoId &&

        player

    ) {

        console.log(
            "Same live broadcast. Leaving player alone."
        );

        return;

    }



    /*
     * Remember the broadcast we're playing.
     */

    currentVideoId =
        videoId;



    console.log(
        "Starting live broadcast:",
        videoId
    );


    console.log(
        "Title:",
        video.snippet.title
    );


    console.log(
        "Actual start:",
        video.liveStreamingDetails
            .actualStartTime
    );



    /*
     * ------------------------------------------------------
     * Destroy previous player ONLY if the broadcast changed.
     * ------------------------------------------------------
     */

    if (player) {

        try {

            player.destroy();

        } catch (error) {

            console.warn(
                "Could not destroy old player:",
                error
            );

        }


        player = null;

    }



    /*
     * Load YouTube API.
     */

    await loadYouTubeAPI();



    /*
     * ------------------------------------------------------
     * CREATE EMBEDDED YOUTUBE PLAYER
     * ------------------------------------------------------
     */

    player =

        new YT.Player(

            "player",

            {


                /*
                 * Current live video ID.
                 */

                videoId:
                    videoId,


                width:
                    "100%",


                height:
                    "100%",



                playerVars: {


                    /*
                     * Try automatic playback.
                     */

                    autoplay:
                        1,


                    /*
                     * Keep video inside the iframe.
                     */

                    playsinline:
                        1,


                    /*
                     * Enable fullscreen button.
                     */

                    fs:
                        1,


                    /*
                     * Don't show unrelated videos.
                     */

                    rel:
                        0,


                    /*
                     * Begin playback normally.
                     *
                     * YouTube's live player will use the
                     * live position.
                     */

                    start:
                        0

                },



                events: {


                    /*
                     * ------------------------------------------------
                     * PLAYER READY
                     * ------------------------------------------------
                     */

                    onReady:
                        function(event) {


                            console.log(
                                "YouTube player ready."
                            );



                            /*
                             * IMPORTANT:
                             *
                             * We DO NOT repeatedly call seekTo().
                             *
                             * We ask YouTube to start at the live
                             * position once.
                             */


                            try {

                                /*
                                 * Request unmuted playback.
                                 */

                                event.target.unMute();


                                /*
                                 * Maximum volume.
                                 */

                                event.target.setVolume(
                                    100
                                );


                                /*
                                 * Start playback.
                                 */

                                event.target.playVideo();


                            } catch (error) {

                                console.warn(
                                    "Autoplay with sound was blocked:",
                                    error
                                );

                            }



                            /*
                             * Request browser fullscreen.
                             */

                            requestFullscreen();



                            /*
                             * Hide loading message.
                             */

                            hideStatus();

                        },



                    /*
                     * ------------------------------------------------
                     * PLAYER STATE CHANGE
                     * ------------------------------------------------
                     */

                    onStateChange:
                        function(event) {


                            console.log(
                                "YouTube state:",
                                event.data
                            );



                            /*
                             * PLAYING = 1
                             */

                            if (

                                event.data ===

                                YT.PlayerState.PLAYING

                            ) {


                                hideStatus();



                                /*
                                 * Request sound again.
                                 *
                                 * IMPORTANT:
                                 *
                                 * We DO NOT call seekTo().
                                 *
                                 * We DO NOT restart the video.
                                 *
                                 * We DO NOT press YouTube's LIVE button.
                                 */

                                try {

                                    player.unMute();

                                    player.setVolume(
                                        100
                                    );

                                } catch (error) {

                                    console.warn(
                                        "Unable to enable sound:",
                                        error
                                    );

                                }

                            }



                            /*
                             * BUFFERING = 3
                             *
                             * Do nothing.
                             *
                             * Let YouTube recover naturally.
                             */

                            if (

                                event.data ===

                                YT.PlayerState.BUFFERING

                            ) {

                                console.log(
                                    "YouTube buffering..."
                                );

                            }



                            /*
                             * ENDED = 0
                             *
                             * The broadcast has ended.
                             *
                             * Look for a NEW broadcast.
                             */

                            if (

                                event.data ===

                                YT.PlayerState.ENDED

                            ) {


                                console.log(
                                    "Live broadcast ended."
                                );


                                currentVideoId =
                                    null;


                                showStatus(
                                    "Finding new Asianet News live stream..."
                                );


                                checkLive();

                            }

                        },



                    /*
                     * ------------------------------------------------
                     * PLAYER ERROR
                     * ------------------------------------------------
                     */

                    onError:
                        function(event) {


                            console.error(
                                "YouTube player error:",
                                event.data
                            );


                            /*
                             * Forget current video.
                             */

                            currentVideoId =
                                null;


                            showStatus(
                                "YouTube player error. Retrying..."
                            );


                            /*
                             * Retry after 5 seconds.
                             */

                            setTimeout(

                                function() {

                                    checkLive();

                                },

                                5000

                            );

                        }

                }

            }

        );

}



/*
============================================================
FULLSCREEN
============================================================
*/


async function requestFullscreen() {


    const container =

        document.getElementById(
            "player-container"
        );



    try {


        /*
         * Already fullscreen.
         */

        if (
            document.fullscreenElement
        ) {

            return;

        }



        /*
         * Standard Fullscreen API.
         */

        if (
            container.requestFullscreen
        ) {

            await container.requestFullscreen();

            console.log(
                "Fullscreen requested."
            );

            return;

        }



        /*
         * Safari fallback.
         */

        if (
            container.webkitRequestFullscreen
        ) {

            container.webkitRequestFullscreen();

            return;

        }


    } catch (error) {


        console.warn(

            "Browser blocked automatic fullscreen:",

            error

        );

    }

}



/*
============================================================
CHECK FOR CURRENT LIVE BROADCAST
============================================================
*/


async function checkLive() {


    /*
     * Don't run multiple API checks at the same time.
     */

    if (checkingLive) {

        return;

    }


    checkingLive =
        true;


    try {


        console.log(
            "Checking Asianet News for active live broadcast..."
        );



        const video =

            await getCurrentLiveVideo();



        /*
         * No active broadcast.
         */

        if (!video) {


            console.log(
                "No active Asianet News broadcast."
            );


            /*
             * IMPORTANT:
             *
             * If a player is already playing,
             * LEAVE IT ALONE.
             *
             * Don't destroy it.
             *
             * Don't reload it.
             *
             * Don't press LIVE.
             */

            if (!player) {

                showStatus(
                    "Asianet News is not currently live."
                );

            }


            checkingLive =
                false;


            return;

        }



        console.log(
            "Verified active stream:",
            video.id
        );



        /*
         * --------------------------------------------------
         * ONLY create a new player when the broadcast ID
         * actually changes.
         * --------------------------------------------------
         */

        if (

            video.id !== currentVideoId

        ) {


            await playLiveVideo(
                video
            );

        } else {


            console.log(
                "Current broadcast is still active. No reload."
            );

        }


    } catch (error) {


        console.error(
            "Live check error:",
            error
        );


        /*
         * Don't destroy an existing working player because
         * of a temporary API/network failure.
         */

        if (!player) {

            showStatus(
                "Unable to connect to YouTube. Retrying..."
            );

        }


    } finally {


        checkingLive =
            false;

    }

}



/*
============================================================
INITIALIZE
============================================================
*/


async function init() {


    showStatus(
        "Finding current Asianet News live stream..."
    );


    /*
     * Find and start current broadcast.
     */

    await checkLive();



    /*
     * Periodically check whether Asianet has started
     * a DIFFERENT live broadcast.
     *
     * This does NOT interfere with the current broadcast.
     */

    setInterval(

        function() {

            checkLive();

        },

        CHECK_INTERVAL

    );

}



/*
============================================================
START APPLICATION
============================================================
*/


init();


</script>

</body>

</html>
