<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asianet News Live</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

#player-container {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
}

#player {
    width: 100%;
    height: 100%;
}

#status {
    position: fixed;
    inset: 0;
    z-index: 9999;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000;
    color: white;

    font-family: Arial, sans-serif;
    font-size: 20px;
    text-align: center;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<div id="player-container">
    <div id="player"></div>
</div>

<div id="status">
    Checking Asianet News live stream...
</div>


<script>

/*
===========================================================
CONFIGURATION
===========================================================
*/

/*
 * IMPORTANT:
 * You exposed your previous API key publicly.
 * REVOKE THAT KEY and create a new restricted key.
 */
const API_KEY = "AIzaSyAanMTtHl2o_pnMBB3i81pDsXV8TBsEdr0";


/*
 * Verified Asianet News channel ID.
 */
const CHANNEL_ID =
    "UCf8w5m0YsRa8MHQ5bwSGmbw";


/*
 * Check every 20 seconds.
 */
const CHECK_INTERVAL = 20000;


let player = null;
let currentVideoId = null;
let youtubeReady = false;


/*
===========================================================
STATUS
===========================================================
*/

function showStatus(text) {
    const status = document.getElementById("status");

    status.textContent = text;
    status.classList.remove("hidden");
}


function hideStatus() {
    document
        .getElementById("status")
        .classList.add("hidden");
}


/*
===========================================================
GET CURRENT LIVE VIDEO
===========================================================
*/

async function getCurrentLiveVideo() {

    /*
     * IMPORTANT:
     *
     * eventType=live means ONLY ACTIVE LIVE BROADCASTS.
     *
     * We are NOT asking for latest uploaded videos.
     */
    const searchURL =
        "https://www.googleapis.com/youtube/v3/search" +
        "?part=snippet" +
        "&channelId=" + encodeURIComponent(CHANNEL_ID) +
        "&eventType=live" +
        "&type=video" +
        "&maxResults=10" +
        "&key=" + encodeURIComponent(API_KEY);


    const response =
        await fetch(searchURL);


    if (!response.ok) {

        const error =
            await response.text();

        console.error(
            "YouTube search API error:",
            error
        );

        throw new Error(
            "YouTube API error"
        );
    }


    const data =
        await response.json();


    console.log(
        "Live search result:",
        data
    );


    if (
        !data.items ||
        data.items.length === 0
    ) {

        return null;
    }


    /*
     * Get all candidate live video IDs.
     */
    const videoIds =
        data.items
            .map(item => item.id.videoId)
            .filter(Boolean);


    if (videoIds.length === 0) {
        return null;
    }


    /*
     * SECOND CHECK:
     *
     * Ask YouTube for liveStreamingDetails.
     *
     * This prevents an old/ended broadcast from being
     * accidentally selected.
     */

    const verifyURL =
        "https://www.googleapis.com/youtube/v3/videos" +
        "?part=snippet,liveStreamingDetails,status" +
        "&id=" +
        encodeURIComponent(videoIds.join(",")) +
        "&key=" +
        encodeURIComponent(API_KEY);


    const verifyResponse =
        await fetch(verifyURL);


    if (!verifyResponse.ok) {

        const error =
            await verifyResponse.text();

        console.error(
            "YouTube verification error:",
            error
        );

        throw new Error(
            "Unable to verify live stream"
        );
    }


    const verifyData =
        await verifyResponse.json();


    console.log(
        "Verified videos:",
        verifyData
    );


    /*
     * ONLY accept a video if:
     *
     * 1. actualStartTime exists
     * 2. actualEndTime does NOT exist
     *
     * This is the important protection against
     * playing an old recorded livestream.
     */

    const active =
        (verifyData.items || [])
        .filter(video => {

            const live =
                video.liveStreamingDetails;

            if (!live) {
                return false;
            }


            const hasStarted =
                Boolean(
                    live.actualStartTime
                );


            const hasNotEnded =
                !live.actualEndTime;


            const embeddable =
                video.status?.embeddable !== false;


            return (
                hasStarted &&
                hasNotEnded &&
                embeddable
            );
        });


    if (active.length === 0) {

        return null;
    }


    /*
     * If multiple live broadcasts exist,
     * choose the newest one.
     */

    active.sort((a, b) => {

        const aTime =
            new Date(
                a.liveStreamingDetails.actualStartTime
            ).getTime();


        const bTime =
            new Date(
                b.liveStreamingDetails.actualStartTime
            ).getTime();


        return bTime - aTime;
    });


    return active[0];
}


/*
===========================================================
LOAD YOUTUBE IFRAME API
===========================================================
*/

function loadYouTubeAPI() {

    return new Promise(resolve => {

        if (
            window.YT &&
            window.YT.Player
        ) {

            youtubeReady = true;

            resolve();

            return;
        }


        window.onYouTubeIframeAPIReady =
            function() {

                youtubeReady = true;

                resolve();
            };


        const script =
            document.createElement("script");


        script.src =
            "https://www.youtube.com/iframe_api";


        document.head.appendChild(script);
    });
}


/*
===========================================================
START VIDEO
===========================================================
*/

async function playLiveVideo(video) {

    const videoId =
        video.id;


    /*
     * Don't reload the same stream every 20 seconds.
     */

    if (
        currentVideoId === videoId &&
        player
    ) {

        return;
    }


    currentVideoId =
        videoId;


    console.log(
        "CURRENT LIVE VIDEO:",
        videoId
    );


    console.log(
        "TITLE:",
        video.snippet.title
    );


    console.log(
        "START:",
        video.liveStreamingDetails.actualStartTime
    );


    /*
     * Destroy previous player.
     */

    if (player) {

        try {
            player.destroy();
        } catch (e) {
            console.warn(e);
        }

        player = null;
    }


    await loadYouTubeAPI();


    /*
     * Create embedded YouTube player.
     */

    player =
        new YT.Player(
            "player",
            {

                videoId: videoId,

                width: "100%",
                height: "100%",


                playerVars: {

                    /*
                     * Automatically start.
                     */
                    autoplay: 1,

                    /*
                     * Live player.
                     */
                    playsinline: 1,

                    /*
                     * Fullscreen capability.
                     */
                    fs: 1,

                    /*
                     * No related videos.
                     */
                    rel: 0,

                    /*
                     * Start at live edge.
                     */
                    start: 0
                },


                events: {

                    onReady:
                    function(event) {

                        console.log(
                            "YouTube player ready"
                        );


                        /*
                         * Mute first so browsers are
                         * more likely to allow autoplay.
                         */

                        event.target.mute();


                        /*
                         * Start playback.
                         */

                        event.target.playVideo();


                        /*
                         * Try browser fullscreen.
                         */

                        requestFullscreen();


                        hideStatus();
                    },


                    onStateChange:
                    function(event) {

                        console.log(
                            "Player state:",
                            event.data
                        );


                        /*
                         * PLAYING = 1
                         */

                        if (
                            event.data ===
                            YT.PlayerState.PLAYING
                        ) {

                            hideStatus();


                            /*
                             * Make sure it is playing
                             * close to the live edge.
                             */

                            try {

                                const duration =
                                    player.getDuration();

                                const current =
                                    player.getCurrentTime();


                                /*
                                 * If more than 30 seconds
                                 * behind the live edge,
                                 * jump forward.
                                 */

                                if (
                                    duration > 0 &&
                                    duration - current > 30
                                ) {

                                    player.seekTo(
                                        duration,
                                        true
                                    );
                                }

                            } catch (e) {
                                console.warn(e);
                            }
                        }


                        /*
                         * If YouTube says ENDED,
                         * look for the next live stream.
                         */

                        if (
                            event.data ===
                            YT.PlayerState.ENDED
                        ) {

                            console.log(
                                "Stream ended. Searching for new live stream..."
                            );


                            currentVideoId =
                                null;


                            checkLive();
                        }
                    },


                    onError:
                    function(event) {

                        console.error(
                            "YouTube player error:",
                            event.data
                        );


                        currentVideoId =
                            null;


                        showStatus(
                            "YouTube player error. Retrying..."
                        );


                        setTimeout(
                            checkLive,
                            5000
                        );
                    }
                }
            }
        );
}


/*
===========================================================
FULLSCREEN
===========================================================
*/

async function requestFullscreen() {

    const container =
        document.getElementById(
            "player-container"
        );


    try {

        /*
         * Standard browser fullscreen.
         */

        if (
            document.fullscreenElement
        ) {

            return;
        }


        if (
            container.requestFullscreen
        ) {

            await container.requestFullscreen();

            console.log(
                "Fullscreen requested"
            );

            return;
        }


        /*
         * Safari.
         */

        if (
            container.webkitRequestFullscreen
        ) {

            container.webkitRequestFullscreen();

            return;
        }

    } catch (error) {

        /*
         * Browser may reject fullscreen because
         * there was no user gesture.
         */

        console.warn(
            "Fullscreen blocked by browser:",
            error
        );
    }
}


/*
===========================================================
CHECK CURRENT LIVE STREAM
===========================================================
*/

async function checkLive() {

    try {

        console.log(
            "Checking for active Asianet News stream..."
        );


        const video =
            await getCurrentLiveVideo();


        if (!video) {

            console.log(
                "No active broadcast found."
            );


            /*
             * If a previous player exists, don't
             * immediately destroy it.
             *
             * The API can temporarily return no result.
             */

            if (!player) {

                showStatus(
                    "Asianet News is not currently live."
                );
            }


            return;
        }


        console.log(
            "ACTIVE STREAM FOUND:",
            video.id
        );


        /*
         * Play only if this is a different broadcast.
         */

        if (
            video.id !== currentVideoId
        ) {

            await playLiveVideo(video);
        }

    } catch (error) {

        console.error(
            "checkLive():",
            error
        );


        if (!player) {

            showStatus(
                "Unable to connect to YouTube. Retrying..."
            );
        }
    }
}


/*
===========================================================
START
===========================================================
*/

async function init() {

    showStatus(
        "Finding current Asianet News live stream..."
    );


    await checkLive();


    /*
     * Keep checking.
     */

    setInterval(
        checkLive,
        CHECK_INTERVAL
    );
}


init();

</script>

</body>
</html>
